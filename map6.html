<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lab 6 - A Simple Flow Map</title>

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin="">
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

        <!-- Load the animation library before the local flow-map plugin. -->
        <script src="https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.umd.js"></script>
        <script src="CanvasFlowmapLayer.js"></script>
        <script src="cook-net.js"></script>

        <style>
            html, body { height: 100%; margin: 0; padding: 0; }
            #map { height: 100%; width: 100%; }

            .title {
                padding: 6px 8px;
                font: 14px/16px Arial, Helvetica, sans-serif;
                background: white;
                background: rgba(255, 255, 255, 0.8);
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
                border-radius: 5px;
                max-width: calc(100vw - 90px);
            }

            .title h3 { margin: 6px 0; line-height: 1.3; }

            .legend {
                padding: 6px 8px;
                font: 14px/20px Arial, Helvetica, sans-serif;
                background: rgba(255, 255, 255, 0.8);
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
                border-radius: 5px;
                max-width: calc(100vw - 40px);
            }

            .legend .line {
                display: inline-block;
                width: 30px;
                margin-right: 6px;
                vertical-align: middle;
            }

            .legend .dot {
                display: inline-block;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                margin-right: 6px;
                vertical-align: middle;
            }
        </style>
    </head>
    <body>
        <div id="map" aria-label="Top 10 net migration flows into Cook County, Illinois"></div>

        <script>
            // Begin with a fullscreen view of the contiguous United States.
            var map = L.map('map', {
                center: [39.23, -97.47],
                zoom: 4
            });

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
                maxZoom: 11,
                minZoom: 3
            }).addTo(map);

            // cook-net.js contains the ten highest Net_B2A values, sorted descending.
            // Each flow starts at County B and travels into Cook County (County A).
            var flowLayer = L.canvasFlowmapLayer(data, {
                originAndDestinationFieldIds: {
                    originUniqueIdField: 'GEOID_B',
                    originGeometry: {
                        x: 'B_lon',
                        y: 'B_lat'
                    },
                    destinationUniqueIdField: 'GEOID_A',
                    destinationGeometry: {
                        x: 'A_lon',
                        y: 'A_lat'
                    }
                },
                // The legend below uses these same net-migration classes.
                canvasBezierStyle: {
                    type: 'classBreaks',
                    field: 'Net_B2A',
                    classBreakInfos: [{
                        classMinValue: 400,
                        classMaxValue: 433,
                        symbol: {
                            strokeStyle: '#AD0755',
                            lineWidth: 10,
                            lineCap: 'round'
                        }
                    }, {
                        classMinValue: 300,
                        classMaxValue: 399,
                        symbol: {
                            strokeStyle: '#B21D63',
                            lineWidth: 6,
                            lineCap: 'round'
                        }
                    }, {
                        classMinValue: 200,
                        classMaxValue: 299,
                        symbol: {
                            strokeStyle: '#CA2070',
                            lineWidth: 3.5,
                            lineCap: 'round'
                        }
                    }]
                },
                onEachFeature: function (feature, layer) {
                    var p = feature.properties;
                    var atB = feature.geometry.coordinates[0] === p.B_lon &&
                        feature.geometry.coordinates[1] === p.B_lat;
                    var name = atB ? p.County_B + ', ' + p.State_B :
                        p.County_A + ', ' + p.State_A;
                    layer.bindTooltip(name);
                },
                pathDisplayMode: 'all',
                animationStarted: true,
                animationEasingFamily: 'Cubic',
                animationEasingType: 'In',
                animationDuration: 2000
            }).addTo(map);

            // Add the map title as a Leaflet control in the top-right corner.
            var title = L.control({ position: 'topright' });

            title.onAdd = function (map) {
                this._div = L.DomUtil.create('div', 'title');
                this._div.innerHTML = '<h3>TOP 10 Net Migration to Cook County, Illinois</h3>';
                return this._div;
            };

            title.addTo(map);

            // Explain the flow-line classes and the default county markers.
            var legend = L.control({ position: 'bottomright' });

            legend.onAdd = function (map) {
                var div = L.DomUtil.create('div', 'legend');
                div.innerHTML = '<b>Net migration to Cook County</b><br>' +
                    '<i class="line" style="height:10px; background:#AD0755"></i>400 to 433<br>' +
                    '<i class="line" style="height:6px; background:#B21D63"></i>300 to 399<br>' +
                    '<i class="line" style="height:3.5px; background:#CA2070"></i>200 to 299<br>' +
                    '<i class="dot" style="background:rgb(195,255,62); border:1px solid #555"></i>Origin county<br>' +
                    '<i class="dot" style="background:rgb(17,142,170)"></i>Destination (Cook County)';
                return div;
            };

            legend.addTo(map);
        </script>
    </body>
</html>
